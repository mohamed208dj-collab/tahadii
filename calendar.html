<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100d20">
<title>تقويمنا ❤️ | LoveSpace</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #100d20;
  --card: rgba(255,255,255,.055);
  --border: rgba(255,255,255,.1);
  --pink: #ff79bd;
  --purple: #a78bfa;
  --text: #fff;
  --muted: #aaa5c2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Alexandria', sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 10% 10%, #49245a55, transparent 35%),
    radial-gradient(circle at 90% 70%, #a13a7950, transparent 35%),
    var(--bg);
  padding: 20px;
}

.container { max-width: 1050px; margin: auto; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.logo {
  color: var(--pink);
  font-size: 20px;
  font-weight: 800;
  text-decoration: none;
}

.back {
  color: white;
  text-decoration: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 15px;
}

.hero { text-align: center; margin: 28px 0; }

.hero .heart {
  font-size: 48px;
  animation: beat 1.5s infinite;
}

@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

h1 { font-size: clamp(25px, 5vw, 38px); margin: 12px 0; }

.hero p { color: var(--muted); font-size: 13px; line-height: 2; }

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(260px, 1fr);
  gap: 18px;
  align-items: start;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 23px;
  padding: 20px;
  backdrop-filter: blur(15px);
  box-shadow: 0 15px 45px #0002;
}

.monthbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 20px;
}

.monthbar h2 { font-size: 17px; margin: 0; }

.navbtn {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  background: #ffffff0a;
  color: white;
  border-radius: 13px;
  cursor: pointer;
  font-size: 20px;
}

.weekdays, .days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
}

.weekday {
  color: var(--muted);
  text-align: center;
  font-size: 11px;
  padding: 8px 0;
}

.day {
  position: relative;
  min-height: 52px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: #ffffff06;
  color: white;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: .2s;
}

.day:hover { background: #ff79bd20; border-color: #ff79bd70; }

.day.today {
  border-color: var(--pink);
  color: var(--pink);
  font-weight: 800;
}

.day.selected {
  background: linear-gradient(135deg, #a78bfa55, #ff79bd55);
  border-color: var(--purple);
}

.day.has-event::after {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--pink);
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
}

.day.empty { cursor: default; background: transparent; }

.section-title { font-size: 16px; margin: 0 0 15px; }

.selected-date {
  color: var(--pink);
  font-size: 12px;
  margin: -5px 0 18px;
}

label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin: 13px 0 7px;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  color: white;
  background: #0d0a19;
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
  font-family: inherit;
  font-size: 12px;
}

input:focus, textarea:focus, select:focus { border-color: var(--pink); }

textarea { resize: vertical; min-height: 75px; }

button.primary {
  width: 100%;
  margin-top: 15px;
  padding: 13px;
  border: 0;
  border-radius: 13px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #160c22;
  font-family: inherit;
  font-weight: 800;
  cursor: pointer;
}

.events { display: grid; gap: 10px; margin-top: 18px; }

.event {
  background: #ffffff08;
  border: 1px solid var(--border);
  border-right: 3px solid var(--pink);
  padding: 13px;
  border-radius: 13px;
}

.event-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: start;
}

.event strong { font-size: 12px; }

.event p {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 8px 0 0;
}

.event small { color: var(--purple); font-size: 10px; }

.delete {
  border: 0;
  color: #ff91b5;
  background: #ff79bd15;
  border-radius: 9px;
  padding: 6px 9px;
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
}

.empty-message {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 20px 5px;
  line-height: 2;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin: 25px 0 5px;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #2c2141;
  border: 1px solid #a78bfa70;
  padding: 12px 18px;
  border-radius: 13px;
  font-size: 12px;
  display: none;
  z-index: 10;
  max-width: 90%;
  text-align: center;
}

@media(max-width: 760px) {
  body { padding: 14px; }
  .layout { grid-template-columns: 1fr; }
  .card { padding: 15px; }
  .day { min-height: 43px; border-radius: 9px; }
  .weekday { font-size: 10px; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <a class="logo" href="home.html">❤️ LoveSpace</a>
  <a class="back" href="home.html">← الرئيسية</a>
</header>

<section class="hero">
  <div class="heart">📅</div>
  <h1>تقويمنا الخاص</h1>
  <p>كل موعد عندنا حكاية، وكل يوم فرصة نصنعو ذكرى جميلة ❤️</p>
</section>

<div class="layout">
  <section class="card">
    <div class="monthbar">
      <button class="navbtn" id="nextMonth" aria-label="الشهر القادم">‹</button>
      <h2 id="monthTitle"></h2>
      <button class="navbtn" id="prevMonth" aria-label="الشهر السابق">›</button>
    </div>

    <div class="weekdays">
      <div class="weekday">الأحد</div>
      <div class="weekday">الإثنين</div>
      <div class="weekday">الثلاثاء</div>
      <div class="weekday">الأربعاء</div>
      <div class="weekday">الخميس</div>
      <div class="weekday">الجمعة</div>
      <div class="weekday">السبت</div>
    </div>

    <div class="days" id="calendarDays"></div>

    <p style="color:var(--muted);font-size:11px;line-height:2;margin:17px 0 0">
      💗 اضغط على أي يوم باش تشوف مواعيده أو تزيد موعد جديد.
    </p>
  </section>

  <section class="card">
    <h2 class="section-title">✨ موعد جديد</h2>
    <p class="selected-date" id="selectedDateLabel"></p>

    <form id="eventForm">
      <label for="eventTitle">اسم المناسبة</label>
      <input id="eventTitle" maxlength="80" placeholder="مثلاً: ذكرى جميلة ❤️" required>

      <label for="eventDate">التاريخ</label>
      <input id="eventDate" type="date" required>

      <label for="eventTime">الوقت (اختياري)</label>
      <input id="eventTime" type="time">

      <label for="eventType">نوع المناسبة</label>
      <select id="eventType">
        <option value="❤️ مناسبة حب">❤️ مناسبة حب</option>
        <option value="🎂 عيد ميلاد">🎂 عيد ميلاد</option>
        <option value="🌹 موعد">🌹 موعد</option>
        <option value="🎁 هدية">🎁 هدية</option>
        <option value="✨ أخرى">✨ أخرى</option>
      </select>

      <label for="eventNotes">تفاصيل إضافية (اختياري)</label>
      <textarea id="eventNotes" maxlength="500" placeholder="اكتب التفاصيل اللي تحب تتفكرها..."></textarea>

      <button class="primary" type="submit">💖 حفظ الموعد</button>
    </form>

    <div style="height:1px;background:var(--border);margin:22px 0"></div>

    <h2 class="section-title">🗓️ مواعيد هذا اليوم</h2>
    <div id="selectedEvents" class="events"></div>
  </section>
</div>

<section class="card" style="margin-top:18px">
  <h2 class="section-title">💌 جميع المواعيد القادمة</h2>
  <div id="upcomingEvents" class="events"></div>
</section>

<div class="footer">صُنعت بكل حب ❤️ | LoveSpace</div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'lovespace_calendar_v1';

const monthNames = [
  'جانفي', 'فيفري', 'مارس', 'أفريل', 'ماي', 'جوان',
  'جويلية', 'أوت', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
];

const $ = id => document.getElementById(id);

const today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();
let selectedDate = dateKey(today);

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function loadEvents() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(data) ? data.filter(e =>
      e && typeof e.id === 'string' &&
      typeof e.title === 'string' &&
      /^\d{4}-\d{2}-\d{2}$/.test(e.date)
    ) : [];
  } catch {
    return [];
  }
}

let events = loadEvents();

function saveEvents() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    return true;
  } catch {
    showToast('ما قدرناش نحفظو التغييرات. تأكد من مساحة المتصفح.');
    return false;
  }
}

function formatDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return `${d} ${monthNames[m - 1]} ${y}`;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function showToast(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => {
    toast.style.display = 'none';
  }, 2600);
}

function renderCalendar() {
  $('monthTitle').textContent = `${monthNames[viewMonth]} ${viewYear}`;

  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysContainer = $('calendarDays');
  daysContainer.innerHTML = '';

  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div');
    blank.className = 'day empty';
    blank.setAttribute('aria-hidden', 'true');
    daysContainer.appendChild(blank);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(viewYear, viewMonth, day);
    const key = dateKey(date);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'day';
    button.textContent = day;
    button.setAttribute('aria-label', formatDate(key));

    if (key === dateKey(today)) button.classList.add('today');
    if (key === selectedDate) button.classList.add('selected');
    if (events.some(e => e.date === key)) button.classList.add('has-event');

    button.addEventListener('click', () => {
      selectedDate = key;
      $('eventDate').value = key;
      renderCalendar();
      renderSelectedEvents();
    });

    daysContainer.appendChild(button);
  }
}

function renderSelectedEvents() {
  $('selectedDateLabel').textContent = formatDate(selectedDate);
  const list = $('selectedEvents');
  const dayEvents = events
    .filter(e => e.date === selectedDate)
    .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

  if (!dayEvents.length) {
    list.innerHTML = '<div class="empty-message">ما كاين حتى موعد لهذا اليوم 🌙<br>تقدر تزيد أول موعد من الفوق.</div>';
    return;
  }

  list.innerHTML = dayEvents.map(e => `
    <article class="event">
      <div class="event-top">
        <div>
          <strong>${escapeHTML(e.title)}</strong>
          <p>${escapeHTML(e.type || '✨ أخرى')}${e.time ? ' · ' + escapeHTML(e.time) : ''}</p>
        </div>
        <button class="delete" type="button" data-delete="${escapeHTML(e.id)}">حذف</button>
      </div>
      ${e.notes ? `<p>${escapeHTML(e.notes)}</p>` : ''}
    </article>
  `).join('');
}

function renderUpcoming() {
  const list = $('upcomingEvents');
  const upcoming = events
    .filter(e => e.date >= dateKey(today))
    .sort((a, b) => a.date.localeCompare(b.date) ||
      (a.time || '').localeCompare(b.time || ''));

  if (!upcoming.length) {
    list.innerHTML = '<div class="empty-message">ما عندك حتى مناسبة قادمة حالياً 💗</div>';
    return;
  }

  list.innerHTML = upcoming.map(e => `
    <article class="event">
      <div class="event-top">
        <div>
          <strong>${escapeHTML(e.title)}</strong>
          <p>${escapeHTML(e.type || '✨ أخرى')}</p>
          <small>📅 ${formatDate(e.date)}${e.time ? ' · 🕒 ' + escapeHTML(e.time) : ''}</small>
        </div>
        <button class="delete" type="button" data-delete="${escapeHTML(e.id)}">حذف</button>
      </div>
      ${e.notes ? `<p>${escapeHTML(e.notes)}</p>` : ''}
    </article>
  `).join('');
}

function renderAll() {
  renderCalendar();
  renderSelectedEvents();
  renderUpcoming();
}

$('prevMonth').addEventListener('click', () => {
  viewMonth++;
  if (viewMonth > 11) {
    viewMonth = 0;
    viewYear++;
  }
  renderCalendar();
});

$('nextMonth').addEventListener('click', () => {
  viewMonth--;
  if (viewMonth < 0) {
    viewMonth = 11;
    viewYear--;
  }
  renderCalendar();
});

$('eventDate').value = selectedDate;

$('eventDate').addEventListener('change', () => {
  if (!$('eventDate').value) return;
  selectedDate = $('eventDate').value;
  const [y, m] = selectedDate.split('-').map(Number);
  viewYear = y;
  viewMonth = m - 1;
  renderAll();
});

$('eventForm').addEventListener('submit', event => {
  event.preventDefault();

  const title = $('eventTitle').value.trim();
  const date = $('eventDate').value;

  if (!title || !date) {
    showToast('عمر اسم المناسبة والتاريخ ❤️');
    return;
  }

  const newEvent = {
    id: (crypto.randomUUID ? crypto.randomUUID() :
      String(Date.now()) + Math.random().toString(16).slice(2)),
    title,
    date,
    time: $('eventTime').value,
    type: $('eventType').value,
    notes: $('eventNotes').value.trim()
  };

  events.push(newEvent);

  if (!saveEvents()) {
    events = events.filter(e => e.id !== newEvent.id);
    return;
  }

  selectedDate = date;
  const [y, m] = date.split('-').map(Number);
  viewYear = y;
  viewMonth = m - 1;

  $('eventTitle').value = '';
  $('eventTime').value = '';
  $('eventNotes').value = '';

  renderAll();
  showToast('تحفظ الموعد بنجاح ❤️');
});

document.addEventListener('click', event => {
  const button = event.target.closest('[data-delete]');
  if (!button) return;

  const id = button.dataset.delete;
  const oldEvents = events;
  events = events.filter(e => e.id !== id);

  if (!saveEvents()) {
    events = oldEvents;
    return;
  }

  renderAll();
  showToast('تم حذف الموعد 🗑️');
});

renderAll();
</script>
</body>
</html>
